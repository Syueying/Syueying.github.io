# Hugo configuration file
title: Syueying

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: 📒 Moments
      pageRef: /moments
      weight: 2
    - name: 🌳 Garden
      pageRef: /garden
      weight: 3
    - name: About
      pageRef: /about
      weight: 4
    - name: Contact ↗
      url: "https://github.com/Syueying"
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/Syueying/Syueying.github.io"
      params:
        icon: github

params:
  comments:
    enable: true
    type: giscus

    giscus:
      repo: Syueying/Syueying.github.io
      repoId: R_kgDOP5k3sQ
      category: Announcements
      categoryId: DIC_kwDOP5k3sc4Cwhvp 

  navbar:
    displayTitle: true
    displayLogo: false
    # logo:
    #   path: images/logo.svg
    #   dark: images/logo-dark.svg
    #   link: /
    #   width: 40
    #   height: 20

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
